<div class="article-page-size article-page-{{ page_size | safe }}">
        <p role="status">{{ total | safe }} {{ result_label | safe }} · Página {{ page | safe }} de {{ pages | safe }}</p>
        <div class="table-wrap responsive-table">
            <table>
                <thead><tr><th>Nombre</th><th>Categoría</th><th>Subcategoría</th>
                    <th>Precio</th><th>Acciones</th></tr></thead>
                <tbody>{{ rows | safe }}</tbody>
            </table>
        </div>
        <nav class="pagination" aria-label="Páginas de artículos">{{ join_links | safe }}</nav>
    </div>
