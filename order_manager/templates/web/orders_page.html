<div class="actions order-create">
    <a class="button add-article" href="{{ new_order_url }}">Agregar nueva orden</a>
</div>
<section class="panel">
        <h2>Órdenes por autor</h2>
        {{ filter_notice | safe }}
        <form class="order-search" method="get" action="/ordenes#order-results">
            <input type="hidden" name="article" value="{{ article_id }}">
            <label>Buscar por número o autor
                <input type="search" name="q" value="{{ query }}"
                       placeholder="90, #90 o nombre del autor">
            </label>
            <div class="actions">
                <button type="submit">Buscar</button>
                <a class="button quiet" href="{{ orders_url_article_id_article_id }}#order-results">
                    Limpiar búsqueda
                </a>
            </div>
        </form>
        <div id="order-results">{{ grouped_orders | safe }}</div>
    </section>
