<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} · Order Manager</title>
    <link rel="stylesheet" href="{{ stylesheet_url }}">
    {{ head | safe }}
</head>
<body>
    <header class="top">
        <a class="brand" href="/">Order Manager <small>v0.3</small></a>
        <nav class="desktop-navigation" aria-label="Secciones">{% for path, label in sections %}<a href="{{ path }}">{{ label }}</a>
{% endfor %}</nav>
        <details class="mobile-navigation">
            <summary class="button quiet">Menú</summary>
            <nav aria-label="Secciones">{% for path, label in sections %}<a href="{{ path }}">{{ label }}</a>
{% endfor %}</nav>
        </details>
    </header>
    <main>
        <h1>{{ title }}</h1>
        {{ content | safe }}
    </main>
    <footer>Order Manager · v0.3</footer>
</body>
</html>
